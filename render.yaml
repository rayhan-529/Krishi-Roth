# Render Blueprint for the Krishi Roth API (free web service).
# Render dashboard -> New -> Blueprint -> pick this repository.
# Secret values (sync: false) are typed into the Render dashboard, never committed.
services:
  - type: web
    name: krishi-roth-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "4000"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash
      - key: UPLOAD_MAX_MB
        value: "3"
      - key: CLIENT_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: krishi_roth
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: AI_API_KEY
        sync: false
