# Render Blueprint for the Krishi Roth API (free web service).
# Render dashboard -> New -> Blueprint -> pick this repository.
# Secret values (sync: false) are typed into the Render dashboard, never committed.
services:
  - type: web
    name: krishi-roth-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "4000"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash
      - key: UPLOAD_MAX_MB
        value: "3"
      - key: CLIENT_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: krishi_roth
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      # ---- Email (Brevo SMTP): password-reset codes, sign-in links ----
      # Port 2525 is used because some hosts block 587/465 on free plans.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # ---- Google sign-in (same id as VITE_GOOGLE_CLIENT_ID on Vercel) ----
      - key: GOOGLE_CLIENT_ID
        sync: false
      # ---- Wallet / Safe Trade ----
      - key: WALLET_BKASH_NUMBER
        sync: false
      - key: WALLET_NAGAD_NUMBER
        sync: false
      - key: WALLET_ROCKET_NUMBER
        sync: false
      - key: WALLET_SMS_SECRET
        generateValue: true
